# --- Outbound Webhooks (Developer -> Outbound Webhooks) ---
# Service-to-service: selects a tenant's matching enabled webhooks and publishes
# ONE signed envelope to RTDH for fan-out (see docs/OutboundWebhooksAPI.md).
# Called by producers (analytics-api) + the sweeper, authorized with the
# platform service/anon key like other internal function-to-function calls.
[functions.outbound-webhook-dispatcher]
verify_jwt = false

# Cron tick: sweeps committed order_status_history + subscription_events since a
# watermark and forwards each to the dispatcher (CRON_SECRET). This is the
# producer for lifecycle/subscription outbound events (no pg_net in this project).
[functions.outbound-webhook-sweeper]
verify_jwt = false
